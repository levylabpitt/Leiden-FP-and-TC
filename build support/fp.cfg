# build.cfg - the default build configuration for this repo, read by build.bat
# when no config is named on the command line (which is how the Patrick Builder
# GUI and build_all.bat run it). Here that default is LEIDEN FP (FrontPanel).
# The repo's other products have their own configs alongside this file:
#   tc.cfg   LEIDEN TC application + installer   build.bat "<repo root>" release tc
#   api.cfg  LEIDEN API VI package               build.bat "<repo root>" release api
# Format: KEY=VALUE, one per line. A '#' at column 0 is a whole-line comment.
# Do NOT put an inline comment after a value - it becomes part of the value.
# Values may contain spaces.

# What to build. The FP .vipb is only the version source here; the release
# asset is the Inno installer. vipBuild is skipped, so build.bat bumps the
# build number itself (noVIPM_IncrementBuild).
BUILD_VIP=false
BUILD_INSTALLER=true

# Build-spec names in src\FrontPanel.lvproj.
APP_SPEC=FrontPanel Application
INST_SPEC=FrontPanel Installer

# Run the git release step (commit/merge/tag/push + GitHub release)?
DO_RELEASE=true

# Tag namespace, so this repo's three products don't share one tag space.
# Tags through 4.57.8.11 were bare. No product here ships SelfUpdate, so a
# slash is safe.
TAG_PREFIX=fp/

# Which product in this repo to build. LVPROJ is relative to the repo root.
VIPB=LEIDEN FP.vipb
LVPROJ=src\FrontPanel.lvproj

# Optional overrides - uncomment to use.
# LVVER / LVBIT default to the .vipb's Package_LabVIEW_Version (19.0 = 2019 32-bit):
# LVVER=2019
LVBIT=32
# APP_NAME=LEIDEN FP
# PUBLISHER=Levylab
