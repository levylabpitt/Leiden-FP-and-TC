# api.cfg - build configuration for the LEIDEN API VI package
# (LevyLab_lib_Leiden_API, from src\shared).
# Run it with:  build.bat "<repo root>" release api
# Format: KEY=VALUE, one per line. A '#' at column 0 is a whole-line comment.
# Do NOT put an inline comment after a value - it becomes part of the value.

# What to build. The package has no application or installer, so no APP_SPEC /
# INST_SPEC is needed; vipBuild also does its own build-number bump.
BUILD_VIP=true
BUILD_INSTALLER=false

# Run the git release step (commit/merge/tag/push + GitHub release)?
DO_RELEASE=true

# Tag namespace, so this repo's three products don't share one tag space.
# Tags through 0.0.5.9 were bare.
TAG_PREFIX=api/

# Which product in this repo to build. LVPROJ is relative to the repo root
# (unused while BUILD_INSTALLER=false).
VIPB=LEIDEN API.vipb
LVPROJ=src\FP and TC shared.lvproj

# Optional overrides - uncomment to use.
# LVVER / LVBIT default to the .vipb's Package_LabVIEW_Version (19.0 = 2019 32-bit):
# LVVER=2019
LVBIT=32
# PUBLISHER=Levylab
